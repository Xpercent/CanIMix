<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="yog-cup" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f2f7fc"/>
      <stop offset="1" stop-color="#d8e5f2"/>
    </linearGradient>
    <linearGradient id="yog-blue" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#69b6f0"/>
      <stop offset=".5" stop-color="#4897d9"/>
      <stop offset="1" stop-color="#2e73b5"/>
    </linearGradient>
    <linearGradient id="yog-lid" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f2f7fc"/>
      <stop offset="1" stop-color="#abc4db"/>
    </linearGradient>
    <linearGradient id="yog-spoon" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#b6c6d4"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="109" rx="42" ry="5.5" fill="#35689c" opacity=".14"/>
  <g transform="translate(58 70) rotate(-8)">
    <!-- 卷起撕开的锡箔杯盖 -->
    <path d="M-25-20c-7-9-3-20 9-19 7 .6 8 9 2 14Z" fill="url(#yog-lid)" stroke="#7598b8" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- 小勺柄 -->
    <g transform="translate(9 -20) rotate(26)">
      <rect x="-3" y="-32" width="6" height="32" rx="3" fill="url(#yog-spoon)" stroke="#7892a8" stroke-width="1.2"/>
      <path d="M-1-28v18" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
    </g>
    <!-- 浓稠酸奶顶层 -->
    <path d="M-24-18c3-9 16-10 24-7 9-4 21-1 24 7Z" fill="#ffffff" stroke="#a3bfd9" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M-13-20c5-3 12-2 16 1M2-21c5-2 10-1 13 2" fill="none" stroke="#cfe0f0" stroke-width="1.3" stroke-linecap="round"/>
    <!-- 酸奶杯身 -->
    <path d="M-27-16l9 48c.6 3.5 3.5 5 7 5h22c3.5 0 6.4-1.5 7-5l9-48Z" fill="url(#yog-cup)" stroke="#7398ba" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- 蓝色乳品腰线 -->
    <path d="M-23.8 2c8-3 16 3 23.8 0 7.8-3 15.8 3 23.8 0l-3.6 19c-8 2.5-15-2-20.2 0-5.2 2-12.2-2.5-20.2 0Z" fill="url(#yog-blue)"/>
    <!-- 白色奶滴图标 -->
    <path d="M0 5.2s4.6 4.8 4.6 7.8a4.6 4.6 0 1 1-9.2 0c0-3 4.6-7.8 4.6-7.8Z" fill="#ffffff"/>
    <!-- 杯口卷边 -->
    <rect x="-29" y="-19.5" width="58" height="6.5" rx="3.2" fill="#ffffff" stroke="#7398ba" stroke-width="1.3"/>
    <!-- 杯身左缘高光 -->
    <path d="M-20-9l6 40" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity=".82"/>
  </g>
</svg>