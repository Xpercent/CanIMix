<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cpm-pill" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fffef2"/>
      <stop offset=".55" stop-color="#fbf0c4"/>
      <stop offset="1" stop-color="#e8d48b"/>
    </linearGradient>
    <linearGradient id="cpm-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#5ac296"/>
      <stop offset="1" stop-color="#2a8760"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#2c7555" opacity=".14"/>
  <!-- 后方药片 -->
  <g transform="translate(65 42) rotate(13)">
    <ellipse cx="0" cy="4.2" rx="21" ry="11.5" fill="#deca82" stroke="#ad9754" stroke-width="1.3"/>
    <ellipse cx="0" cy="0" rx="21" ry="11.5" fill="url(#cpm-pill)" stroke="#b39c57" stroke-width="1.3"/>
    <path d="M-13-5.8a16 8.5 0 0 1 11-2.4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
  </g>
  <!-- 前方带刻痕药片 -->
  <g transform="translate(47 69) rotate(-18)">
    <ellipse cx="0" cy="5.2" rx="26.5" ry="14.2" fill="#dcc77d" stroke="#a6904d" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="26.5" ry="14.2" fill="url(#cpm-pill)" stroke="#ab9551" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="21" ry="10" fill="none" stroke="#efe2af" stroke-width="1"/>
    <path d="M0-11v22" stroke="#b8a25d" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M1.3-10v20" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity=".88"/>
    <path d="M-17-7.5a20 10 0 0 1 13-2.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity=".92"/>
  </g>
  <!-- 右下角抗过敏（阻隔花粉）角标 -->
  <g transform="translate(88 82)">
    <circle cx="0" cy="3" r="21" fill="#1e6346" opacity=".15"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19.5" fill="url(#cpm-badge)" stroke="#226e4e" stroke-width="1.5"/>
    <!-- 花粉微粒 -->
    <g fill="#ffffff">
      <circle cx="0" cy="-6.8" r="2.5"/>
      <circle cx="5.9" cy="-3.4" r="2.5"/>
      <circle cx="5.9" cy="3.4" r="2.5"/>
      <circle cx="0" cy="6.8" r="2.5"/>
      <circle cx="-5.9" cy="3.4" r="2.5"/>
      <circle cx="-5.9" cy="-3.4" r="2.5"/>
      <circle cx="0" cy="0" r="3.4"/>
    </g>
    <!-- 阻隔斜杠 -->
    <path d="M-8.5 8.5L8.5-8.5" stroke="#34946b" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M-8.5 8.5L8.5-8.5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>