    <path d="M-3.4-1.5a.9.9 0 1 1 0 .1M2.4-1.5a.9.9 0 1 1 0 .1" stroke="#1d8264" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-2.8 3.2q2.3 1.8 4.6 0" fill="none" stroke="#1d8264" stroke-width="1.6" stroke-linecap="round"/>
