<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ntg-glass" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#7a381d"/>
      <stop offset=".28" stop-color="#b35c2e"/>
      <stop offset=".6" stop-color="#a85428"/>
      <stop offset="1" stop-color="#6b2e16"/>
    </linearGradient>
    <linearGradient id="ntg-cap" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#dfe6ed"/>
      <stop offset=".4" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3ced9"/>
    </linearGradient>
    <linearGradient id="ntg-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f25252"/>
      <stop offset="1" stop-color="#bd1e1e"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#7d2514" opacity=".15"/>
  <!-- 避光棕色小药瓶 -->
  <g transform="translate(52 61) rotate(-14)">
    <path d="M-9-22v5c0 2.2-1.8 3.8-3.5 5-3 2-4.5 4.5-4.5 8.5V22c0 4 2.5 6.5 6.5 6.5h21c4 0 6.5-2.5 6.5-6.5V-3.5c0-4-1.5-6.5-4.5-8.5-1.7-1.2-3.5-2.8-3.5-5v-5Z" fill="url(#ntg-glass)" stroke="#612812" stroke-width="1.3"/>
    <!-- 玻璃竖向反光 -->
    <path d="M-12.5-1v20" fill="none" stroke="#e8a77b" stroke-width="1.8" stroke-linecap="round" opacity=".72"/>
    <!-- 瓶身白色药签 -->
    <rect x="-15.5" y="-3" width="31" height="20" rx="2" fill="#fffdf7" stroke="#d4c4a8" stroke-width="1"/>
    <path d="M-10.5 3h21M-10.5 11h21" stroke="#d9534f" stroke-width="1" stroke-linecap="round" opacity=".75"/>
    <path d="M-2 7h4M0 5v4" stroke="#d92b2b" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 白色瓶盖 -->
    <rect x="-11.5" y="-32" width="23" height="12" rx="2.8" fill="url(#ntg-cap)" stroke="#8b9aab" stroke-width="1.2"/>
    <path d="M-7.5-29v6m3.8-6v6m3.7-6v6m3.8-6v6m3.7-6v6" stroke="#9aa8b8" stroke-width="1" opacity=".75"/>
  </g>
  <!-- 舌下含服微小圆片 -->
  <g transform="translate(36 96) rotate(-12)">
    <ellipse cx="0" cy="2.6" rx="9" ry="5.4" fill="#cfd8e3" stroke="#8594a6" stroke-width="1.1"/>
    <ellipse cx="0" cy="0" rx="9" ry="5.4" fill="#ffffff" stroke="#8a99ab" stroke-width="1.1"/>
    <path d="M-5-2.4a6 3 0 0 1 5-1.2" fill="none" stroke="#ffffff" stroke-width="1.2" opacity=".9"/>
  </g>
  <g transform="translate(54 101) rotate(10)">
    <ellipse cx="0" cy="2.4" rx="8.2" ry="4.8" fill="#cfd8e3" stroke="#8594a6" stroke-width="1.1"/>
    <ellipse cx="0" cy="0" rx="8.2" ry="4.8" fill="#ffffff" stroke="#8a99ab" stroke-width="1.1"/>
  </g>
  <!-- 右下角心脏心电急救角标 -->
  <g transform="translate(88 82)">
    <circle cx="0" cy="3" r="21" fill="#8c1414" opacity=".16"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19.5" fill="url(#ntg-badge)" stroke="#9e1717" stroke-width="1.5"/>
    <path d="M0 9.8C-1.2 8.7-10.2 2.4-10.2-3.4a5.3 5.3 0 0 1 10.2-2 5.3 5.3 0 0 1 10.2 2C10.2 2.4 1.2 8.7 0 9.8Z" fill="#ffffff" stroke="#9c1616" stroke-width=".9" stroke-linejoin="round"/>
    <!-- 心电脉搏折线 -->
    <path d="M-7.5-.8h3.4l1.8-3.6L0 3.6l2.3-5.6 1.6 1.2h3.6" fill="none" stroke="#d42626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>