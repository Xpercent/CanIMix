    <ellipse cx="0" cy="4.8" rx="23" ry="12.8" fill="#d4af3d" stroke="#9c7c1d" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="23" ry="12.8" fill="url(#col-pill)" stroke="#a38221" stroke-width="1.5"/>
