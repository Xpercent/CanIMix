<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="iso-gel" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f28c5e"/>
      <stop offset=".55" stop-color="#c44b25"/>
      <stop offset="1" stop-color="#87270e"/>
    </linearGradient>
    <linearGradient id="iso-gel-back" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#eb7d4d"/>
      <stop offset="1" stop-color="#9c3214"/>
    </linearGradient>
    <linearGradient id="iso-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#4cc29e"/>
      <stop offset="1" stop-color="#1d8264"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#7d250d" opacity=".14"/>
  <!-- 后方软胶囊 -->
  <g transform="translate(65 44) rotate(16)">
    <rect x="-21" y="-11" width="42" height="22" rx="11" fill="url(#iso-gel-back)" stroke="#7a220b" stroke-width="1.4"/>
