    <ellipse cx="0" cy="4.8" rx="23.5" ry="13.2" fill="#a689de" stroke="#6e56a1" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="23.5" ry="13.2" fill="url(#tca-pill)" stroke="#735ba6" stroke-width="1.5"/>
    <ellipse cx="-1" cy="-1" rx="15" ry="7" fill="#ffffff" opacity=".25"/>
    <path d="M-15-7a18 9 0 0 1 13-2.8" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" opacity=".92"/>
  </g>
  <!-- 右下角三环骨架角标 -->
