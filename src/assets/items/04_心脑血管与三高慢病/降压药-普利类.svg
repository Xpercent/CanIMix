    <path d="M-12-5.5h18" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
  </g>
  <!-- 前方淡薄荷绿椭圆刻痕片 -->
  <g transform="translate(47 68) rotate(-22)">
    <rect x="-26" y="-8.5" width="52" height="26" rx="13" fill="#9eccb3" stroke="#5b8c71" stroke-width="1.5"/>
    <rect x="-26" y="-13" width="52" height="26" rx="13" fill="url(#ace-pill)" stroke="#609176" stroke-width="1.5"/>
    <path d="M0-10v20" stroke="#75a68b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M1.4-9v18" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity=".9"/>
    <path d="M-16-8h24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".92"/>
  </g>
  <!-- 右下角血压柱下降角标 -->
  <g transform="translate(88 82)">
    <circle cx="0" cy="3" r="21" fill="#1e397a" opacity=".15"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19.5" fill="url(#ace-badge)" stroke="#24438f" stroke-width="1.5"/>
    <!-- 压力柱 -->
