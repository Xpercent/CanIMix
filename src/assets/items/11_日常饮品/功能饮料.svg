    <path d="M-21-28l4-7.5h34l4 7.5Z" fill="url(#eng-metal)" stroke="#6c7e8f" stroke-width="1.3" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-35.5" rx="17" ry="4" fill="#e8f0f5" stroke="#6c7e8f" stroke-width="1.3"/>
    <ellipse cx="0" cy="-35.5" rx="12" ry="2.2" fill="none" stroke="#98aab8" stroke-width="1"/>
    <rect x="-3.5" y="-37" width="7" height="2.8" rx="1.2" fill="#889aab"/>
