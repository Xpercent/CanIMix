<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="vcq-pill" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#9fe08b"/>
      <stop offset=".55" stop-color="#48a34c"/>
      <stop offset="1" stop-color="#226629"/>
    </linearGradient>
    <linearGradient id="vcq-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f5a042"/>
      <stop offset="1" stop-color="#c96b12"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#205926" opacity=".14"/>
  <!-- 后方翠绿糖衣片 -->
  <g transform="translate(65 42) rotate(13)">
    <ellipse cx="0" cy="4.2" rx="20.5" ry="11.5" fill="#1e5c24" stroke="#144018" stroke-width="1.3"/>
    <ellipse cx="0" cy="0" rx="20.5" ry="11.5" fill="url(#vcq-pill)" stroke="#194d1e" stroke-width="1.3"/>
    <path d="M-12-5.5a15 8 0 0 1 11-2.5" fill="none" stroke="#e4ffd9" stroke-width="1.6" stroke-linecap="round" opacity=".82"/>
  </g>
  <!-- 前方主糖衣片 -->
  <g transform="translate(47 69) rotate(-18)">
    <ellipse cx="0" cy="5.2" rx="26" ry="14.2" fill="#1b5420" stroke="#113815" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="26" ry="14.2" fill="url(#vcq-pill)" stroke="#17471c" stroke-width="1.5"/>
    <ellipse cx="-1" cy="-1" rx="16.5" ry="7.4" fill="#ffffff" opacity=".2"/>
    <path d="M-16-7.5a19 9.5 0 0 1 14-3" fill="none" stroke="#ebffe3" stroke-width="2" stroke-linecap="round" opacity=".88"/>
  </g>
  <!-- 右下角维C+银翘角标 -->
  <g transform="translate(88 82)">
    <circle cx="0" cy="3" r="21" fill="#8c4709" opacity=".15"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19.5" fill="url(#vcq-badge)" stroke="#a3550b" stroke-width="1.5"/>
    <!-- 字母 C -->
    <path d="M.8-4.8A6.2 6.6 0 1 0 .8 4.8" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 银翘嫩叶 -->
    <path d="M3.2 5.2C3.2-1 6-5.2 10.2-5.8c.4 5.8-2.4 10.2-7 11Z" fill="#ffffff" stroke="#a3550b" stroke-width=".7" stroke-linejoin="round"/>
  </g>
</svg>