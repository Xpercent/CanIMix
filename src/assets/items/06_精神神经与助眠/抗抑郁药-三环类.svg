    <circle cx="0" cy="3" r="21" fill="#352682" opacity=".15"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19.5" fill="url(#tca-badge)" stroke="#3b2b8a" stroke-width="1.5"/>
    <!-- 6-7-6 三环母核结构 -->
    <g fill="#ffffff" fill-opacity=".18" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="-2.2,-2.3 -4.8,-5.5 -8.6,-5.1 -10,-1.5 -7.8,1.7 -4.4,.7"/>
      <polygon points="-2.2,-2.3 2.2,-2.3 4.4,.7 3,4.3 0,5.5 -3,4.3 -4.4,.7"/>
      <polygon points="2.2,-2.3 4.8,-5.5 8.6,-5.1 10,-1.5 7.8,1.7 4.4,.7"/>
