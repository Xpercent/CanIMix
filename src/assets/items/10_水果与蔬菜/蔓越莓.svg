<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cran-berry" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f2495f"/>
      <stop offset=".5" stop-color="#bd192f"/>
      <stop offset="1" stop-color="#750a18"/>
    </linearGradient>
    <linearGradient id="cran-leaf" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#6eb55e"/>
      <stop offset="1" stop-color="#2e6b31"/>
    </linearGradient>
  </defs>
  <ellipse cx="63" cy="108" rx="42" ry="5.5" fill="#70101c" opacity=".15"/>
  <!-- 绿叶背景 -->
  <g stroke="#28592a" stroke-width="1.3" stroke-linejoin="round">
    <path d="M56 44C46 30 30 23 22 31c-6 6 2 22 22 25Z" fill="url(#cran-leaf)"/>
    <path d="M64 42c10-16 27-22 36-13 7 7-3 23-24 26Z" fill="url(#cran-leaf)"/>
    <path d="M30 33l16 14M91 31L73 45" stroke="#b5e3a3" stroke-width="1.2" stroke-linecap="round" opacity=".75"/>
  </g>
  <!-- 蔓越莓浆果簇 -->
  <g>
    <!-- 上方果 -->
    <ellipse cx="61" cy="48" rx="15" ry="13.5" fill="url(#cran-berry)" stroke="#630a15" stroke-width="1.3"/>
    <path d="M52 41a9 7 0 0 1 11-2" fill="none" stroke="#ffc2cb" stroke-width="2" stroke-linecap="round" opacity=".82"/>
    <!-- 左侧果 -->
    <ellipse cx="41" cy="69" rx="16.5" ry="15" fill="url(#cran-berry)" stroke="#630a15" stroke-width="1.4"/>
    <path d="M31 61a10 8 0 0 1 12-2" fill="none" stroke="#ffc2cb" stroke-width="2.1" stroke-linecap="round" opacity=".82"/>
    <!-- 右侧果 -->
    <ellipse cx="83" cy="67" rx="16" ry="14.5" fill="url(#cran-berry)" stroke="#630a15" stroke-width="1.4"/>
    <path d="M74 59a10 8 0 0 1 11-2" fill="none" stroke="#ffc2cb" stroke-width="2.1" stroke-linecap="round" opacity=".82"/>
    <!-- 前方主果（带花萼凹痕） -->
    <ellipse cx="60" cy="82" rx="18" ry="16" fill="url(#cran-berry)" stroke="#5c0812" stroke-width="1.5"/>
    <path d="M58 92l2-3 2 3m-4-2l4-1" fill="none" stroke="#52060f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M49 73a11 9 0 0 1 14-2.5" fill="none" stroke="#ffd1d8" stroke-width="2.4" stroke-linecap="round" opacity=".88"/>
  </g>
</svg>