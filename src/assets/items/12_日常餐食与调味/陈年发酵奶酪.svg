<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fchs-top" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff8dc"/>
      <stop offset="1" stop-color="#edd587"/>
    </linearGradient>
    <linearGradient id="fchs-front" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f2d67e"/>
      <stop offset="1" stop-color="#cc9b3b"/>
    </linearGradient>
    <linearGradient id="fchs-rind" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#c9933c"/>
      <stop offset="1" stop-color="#8c5d19"/>
    </linearGradient>
    <linearGradient id="fchs-mold" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#6ca39b"/>
      <stop offset="1" stop-color="#3c6963"/>
    </linearGradient>
  </defs>

  <!-- 底部投影 -->
  <ellipse cx="62" cy="108" rx="43" ry="5.5" fill="#7a5e22" opacity=".16"/>

  <!-- 发酵香气波纹与微气泡 -->
  <g fill="none" stroke="#7da68b" stroke-width="1.8" stroke-linecap="round" opacity=".78">
    <path d="M40 54c-4-7 4-13 0-20"/>
    <path d="M58 43c-5-8 5-15 0-24"/>
    <path d="M76 36c-4-6 3-11 0-17"/>
  </g>
  <g fill="#8ab398" opacity=".7">
    <circle cx="48" cy="36" r="1.8"/>
    <circle cx="67" cy="25" r="1.4"/>
    <circle cx="84" cy="29" r="1.6"/>
  </g>

  <g transform="translate(61 73) rotate(-8)">
    <!-- 发酵奶酪顶面 -->
    <path d="M-36-2L26-28c10 7 14 18 14 28l-76-2Z" fill="url(#fchs-top)" stroke="#9c7222" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- 顶部外皮边缘纹理 -->
    <path d="M23.5-26.8c9.2 6.8 13 17 13 26.8l3.5 0c0-10-4-21-14-28Z" fill="url(#fchs-rind)" opacity=".55"/>

    <!-- 奶酪正面切面 -->
    <path d="M-36-2l76 2v26l-76-2Z" fill="url(#fchs-front)" stroke="#9c7222" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- 右侧弧形熟化外皮 -->
    <path d="M26-28c10 7 14 18 14 28v26c0-10-4-21-14-28" fill="url(#fchs-rind)" opacity=".38"/>

    <!-- 蓝纹发酵菌脉与气孔 -->
    <g>
      <!-- 菌丝纹路 -->
      <path d="M-24 10c6-2 10 3 15 2s9-5 15-2M-12 12c2 5 0 8-3 10M12 10c4 3 4 9 1 13M22 8c5 1 9 5 12 4" fill="none" stroke="url(#fchs-mold)" stroke-width="1.7" stroke-linecap="round" opacity=".88"/>
      <path d="M-10-6c5-1 8 2 13 0M8-13c5-2 10 1 14-1" fill="none" stroke="url(#fchs-mold)" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>

      <!-- 带发酵菌斑的立体气孔 -->
      <circle cx="-10" cy="12" r="5.5" fill="#46756e" stroke="#365c56" stroke-width="1"/>
      <circle cx="-9.2" cy="12.7" r="4" fill="#63968e"/>

      <circle cx="14" cy="11" r="4.6" fill="#46756e" stroke="#365c56" stroke-width="1"/>
      <circle cx="14.6" cy="11.6" r="3.4" fill="#63968e"/>

      <circle cx="28" cy="17" r="3.2" fill="#4e8078" stroke="#365c56" stroke-width=".9"/>

      <!-- 顶部发酵气孔与菌点 -->
      <ellipse cx="10" cy="-9" rx="5.2" ry="3" fill="#5b8f87" stroke="#3c6660" stroke-width=".9"/>
      <ellipse cx="-8" cy="-5" rx="3.5" ry="2" fill="#5b8f87" stroke="#3c6660" stroke-width=".8"/>
      <circle cx="23" cy="-6" r="1.8" fill="#4f8078"/>
      <circle cx="3" cy="5" r="1.6" fill="#4f8078"/>
      <circle cx="-23" cy="17" r="1.4" fill="#4f8078"/>
    </g>

    <!-- 高光 -->
    <path d="M-24-6l38-16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".68"/>
  </g>
</svg>