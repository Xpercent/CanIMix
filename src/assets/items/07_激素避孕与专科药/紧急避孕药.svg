<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ecp-pill" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#faf2f5"/>
      <stop offset="1" stop-color="#ebd5dd"/>
    </linearGradient>
    <linearGradient id="ecp-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f25c7c"/>
      <stop offset="1" stop-color="#bf2447"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#991e3a" opacity=".14"/>
  <!-- 后方辅片 -->
  <g transform="translate(65 42) rotate(13)">
    <ellipse cx="0" cy="4" rx="19.5" ry="11" fill="#dec2cc" stroke="#ab8290" stroke-width="1.3"/>
    <ellipse cx="0" cy="0" rx="19.5" ry="11" fill="url(#ecp-pill)" stroke="#b08795" stroke-width="1.3"/>
    <path d="M-11.5-5.2a14 7.5 0 0 1 10-2.2" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".92"/>
  </g>
  <!-- 前方白色刻痕主片 -->
  <g transform="translate(47 69) rotate(-18)">
    <ellipse cx="0" cy="5.2" rx="26" ry="14.2" fill="#dbbec8" stroke="#a37987" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="26" ry="14.2" fill="url(#ecp-pill)" stroke="#a87e8c" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="20.5" ry="10" fill="none" stroke="#f2e1e7" stroke-width="1"/>
    <path d="M0-10.5v21" stroke="#b8919e" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M1.3-9.5v19" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity=".9"/>
    <path d="M-17-7.5a20 9.8 0 0 1 13-2.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity=".94"/>
  </g>
  <!-- 右下角急时效时钟♀角标 -->
  <g transform="translate(88 82)">
    <circle cx="0" cy="3" r="21" fill="#8f1733" opacity=".15"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19.5" fill="url(#ecp-badge)" stroke="#a11b3a" stroke-width="1.5"/>
    <!-- 急时效外弧 -->
    <path d="M7.2-8.2a10.8 10.8 0 0 1 3.4 6" fill="none" stroke="#ffd1dc" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 时钟表盘融合♀ -->
    <circle cx="0" cy="-3" r="6.8" fill="#ffffff"/>
    <path d="M0-6.8v3.8l2.8 1.5" fill="none" stroke="#c7284b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 3.8v7.2M-4 7.5h8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>