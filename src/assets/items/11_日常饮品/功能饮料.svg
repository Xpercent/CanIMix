    <path d="M-14-23v48" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".52"/>
    <path d="M13-22v47" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity=".25"/>
