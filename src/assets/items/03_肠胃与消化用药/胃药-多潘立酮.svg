    <path d="M-11-5a14 7.5 0 0 1 10-2.3" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".92"/>
  </g>
  <!-- 前方光滑双凸圆片 -->
