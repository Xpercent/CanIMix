      <stop offset=".55" stop-color="#fae496"/>
      <stop offset="1" stop-color="#e3bf4d"/>
    </linearGradient>
    <linearGradient id="col-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#9c6ad9"/>
      <stop offset="1" stop-color="#5d3296"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#4c287a" opacity=".14"/>
  <!-- 后方微片 -->
  <g transform="translate(66 43) rotate(12)">
    <ellipse cx="0" cy="3.8" rx="18" ry="10.2" fill="#d6b240" stroke="#a18020" stroke-width="1.3"/>
