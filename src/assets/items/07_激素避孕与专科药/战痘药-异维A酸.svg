    <rect x="-27" y="-13.5" width="54" height="27" rx="13.5" fill="url(#iso-gel)" stroke="#752009" stroke-width="1.5"/>
    <ellipse cx="0" cy="1.2" rx="17" ry="6.5" fill="#ffdcc7" opacity=".32"/>
    <path d="M-17-7.2h26" fill="none" stroke="#fff0e6" stroke-width="2.6" stroke-linecap="round" opacity=".84"/>
    <circle cx="14" cy="-7.2" r="1.4" fill="#fff0e6" opacity=".84"/>
  </g>
  <!-- 右下角净颜战痘角标 -->
