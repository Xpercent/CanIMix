    <circle cx="0" cy="3" r="21" fill="#8c450b" opacity=".15"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19.5" fill="url(#dom-badge)" stroke="#a3510d" stroke-width="1.5"/>
