<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="soy-glass" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#dbe9f2"/>
      <stop offset=".35" stop-color="#f5fafc"/>
      <stop offset=".8" stop-color="#e3eff7"/>
      <stop offset="1" stop-color="#c3d8e6"/>
    </linearGradient>
    <linearGradient id="soy-milk" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fffcf0"/>
      <stop offset=".55" stop-color="#fae9c5"/>
      <stop offset="1" stop-color="#e8cb92"/>
    </linearGradient>
    <linearGradient id="soy-bean" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fae08c"/>
      <stop offset=".6" stop-color="#e3b149"/>
      <stop offset="1" stop-color="#bd8524"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="108" rx="42" ry="5.5" fill="#8f6b32" opacity=".14"/>
  <!-- 倾斜豆浆玻璃杯 -->
  <g transform="translate(56 66) rotate(-7)">
    <!-- 袅袅热气 -->
    <path d="M-7-38c-3-4 3-7 0-11M5-37c-3-4 3-7 0-11" fill="none" stroke="#d9b779" stroke-width="1.8" stroke-linecap="round" opacity=".65"/>
    <!-- 玻璃杯外壁 -->
    <path d="M-24-28L-17 32c0 4 3 6 7 6h20c4 0 7-2 7-6l7-60Z" fill="url(#soy-glass)" stroke="#88a8bd" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- 内部醇厚豆浆 -->
    <path d="M-20.5-12L-14.5 29c0 3 2.5 4.5 6 4.5h17c3.5 0 6-1.5 6-4.5l6-41Z" fill="url(#soy-milk)"/>
    <!-- 豆浆顶部奶沫面 -->
    <ellipse cx="0" cy="-12" rx="20.5" ry="5.5" fill="#fffdf5" stroke="#e5cfa1" stroke-width="1"/>
    <path d="M-11-12.5a12 3 0 0 1 11-1.8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
    <!-- 杯口玻璃椭圆 -->
    <ellipse cx="0" cy="-28" rx="24" ry="6.2" fill="none" stroke="#88a8bd" stroke-width="1.4"/>
    <ellipse cx="0" cy="-28" rx="22.5" ry="5" fill="#ffffff" opacity=".2"/>
    <!-- 玻璃竖向高光 -->
    <path d="M-18-20l5 48" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity=".78"/>
  </g>
  <!-- 前景黄豆粒 -->
  <g transform="translate(86 96) rotate(-18)">
    <ellipse cx="0" cy="0" rx="8.5" ry="6.5" fill="url(#soy-bean)" stroke="#9e6d1a" stroke-width="1.2"/>
    <path d="M-2.5 3.6c1.5.5 3.5.5 5 0" fill="none" stroke="#7d520e" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M-4.5-2.5a6 4 0 0 1 5-1.5" fill="none" stroke="#fff7d6" stroke-width="1.3" stroke-linecap="round" opacity=".85"/>
  </g>
  <g transform="translate(97 102) rotate(14)">
    <ellipse cx="0" cy="0" rx="7.5" ry="5.8" fill="url(#soy-bean)" stroke="#9e6d1a" stroke-width="1.2"/>
    <path d="M-2 3.2c1.4.4 3 .4 4.4 0" fill="none" stroke="#7d520e" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-4-2.2a5 3.5 0 0 1 4.2-1.3" fill="none" stroke="#fff7d6" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
  </g>
</svg>