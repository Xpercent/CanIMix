<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="licp-pill" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#b87b4b"/>
      <stop offset=".55" stop-color="#8f532c"/>
      <stop offset="1" stop-color="#663619"/>
    </linearGradient>
    <linearGradient id="licp-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7ca658"/>
      <stop offset="1" stop-color="#4b732e"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#4f3218" opacity=".15"/>
  <!-- 后方棕褐色甘草片 -->
  <g transform="translate(65 42) rotate(13)">
    <ellipse cx="0" cy="4.2" rx="20.5" ry="11.5" fill="#5c3015" stroke="#42200c" stroke-width="1.3"/>
    <ellipse cx="0" cy="0" rx="20.5" ry="11.5" fill="url(#licp-pill)" stroke="#4d2610" stroke-width="1.3"/>
    <path d="M-12-5.5a15 8 0 0 1 11-2.5" fill="none" stroke="#e8c3a0" stroke-width="1.4" stroke-linecap="round" opacity=".68"/>
  </g>
  <!-- 前方主棕褐色片（带细腻草本斑点） -->
  <g transform="translate(47 69) rotate(-18)">
    <ellipse cx="0" cy="5.2" rx="26" ry="14.2" fill="#592e14" stroke="#3d1d0a" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="26" ry="14.2" fill="url(#licp-pill)" stroke="#4a240e" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="20.5" ry="10" fill="none" stroke="#a66b41" stroke-width=".9" opacity=".65"/>
    <g fill="#4d250d" opacity=".48">
      <circle cx="-9" cy="-2" r="1.1"/><circle cx="-4" cy="4" r=".9"/>
      <circle cx="5" cy="-3" r="1"/><circle cx="11" cy="2" r="1.2"/>
      <circle cx="1" cy="1" r=".8"/><circle cx="-13" cy="3" r=".9"/>
    </g>
    <path d="M-17-7.5a20 9.8 0 0 1 13-2.8" fill="none" stroke="#f0d1b4" stroke-width="1.7" stroke-linecap="round" opacity=".72"/>
  </g>
  <!-- 右下角中成药本草角标 -->
  <g transform="translate(88 82)">
    <circle cx="0" cy="3" r="21" fill="#3a5c22" opacity=".15"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19.5" fill="url(#licp-badge)" stroke="#3f6324" stroke-width="1.5"/>
    <!-- 双叶本草图标 -->
    <path d="M-9 6C-10-3-4-9 5-9c1 9-4 15-14 15Z" fill="#ffffff" stroke="#3d6122" stroke-width=".9" stroke-linejoin="round"/>
    <path d="M1 8C1 1 5-4 11-5c1 7-3 12-10 13Z" fill="#e6f2d8" stroke="#3d6122" stroke-width=".9" stroke-linejoin="round"/>
    <path d="M-7 4c3-4 6-7 10-10" fill="none" stroke="#5c873b" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>