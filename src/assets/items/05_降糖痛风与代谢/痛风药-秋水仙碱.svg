    <circle cx="0" cy="3" r="21" fill="#472375" opacity=".15"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19.5" fill="url(#col-badge)" stroke="#4d287d" stroke-width="1.5"/>
