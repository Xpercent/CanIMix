<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="zdr-pill" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f5f5fc"/>
      <stop offset="1" stop-color="#dfe2f2"/>
    </linearGradient>
    <linearGradient id="zdr-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#8978de"/>
      <stop offset="1" stop-color="#4e3da6"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#3a2d82" opacity=".14"/>
  <!-- 后方药片 -->
  <g transform="translate(66 42) rotate(12)">
    <rect x="-19" y="-5.5" width="38" height="19" rx="9.5" fill="#d0d4e8" stroke="#898fb0" stroke-width="1.3"/>
    <rect x="-19" y="-9.5" width="38" height="19" rx="9.5" fill="url(#zdr-pill)" stroke="#8e94b5" stroke-width="1.3"/>
    <path d="M-11-5.2h18" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".92"/>
  </g>
  <!-- 前方白色长椭圆刻痕片 -->
  <g transform="translate(47 68) rotate(-24)">
    <rect x="-27.5" y="-8.5" width="55" height="26" rx="13" fill="#cdd1e6" stroke="#8389ab" stroke-width="1.5"/>
    <rect x="-27.5" y="-13" width="55" height="26" rx="13" fill="url(#zdr-pill)" stroke="#888eb0" stroke-width="1.5"/>
    <path d="M0-10v20" stroke="#9ea4c4" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M1.4-9v18" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity=".9"/>
    <path d="M-16.5-8.6h25" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".94"/>
  </g>
  <!-- 右下角弯月Z角标 -->
  <g transform="translate(88 82)">
    <circle cx="0" cy="3" r="21" fill="#372980" opacity=".15"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19.5" fill="url(#zdr-badge)" stroke="#40308f" stroke-width="1.5"/>
    <!-- 弯月 -->
    <g transform="translate(-2.2 0) rotate(-15)">
      <path d="M2.5-6.2a7.6 7.6 0 1 0 0 12.4 6.4 6.4 0 1 1 0-12.4Z" fill="#ffffff"/>
    </g>
    <!-- Z 字标识（Z-drugs） -->
    <path d="M2-4.2h6.8L2 4.2h6.8" fill="none" stroke="#ffe68a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>