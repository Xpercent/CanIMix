<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bzd-pill" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f2f8ff"/>
      <stop offset=".55" stop-color="#c4ddf7"/>
      <stop offset="1" stop-color="#91bae6"/>
    </linearGradient>
    <linearGradient id="bzd-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#5c72cc"/>
      <stop offset="1" stop-color="#2c3e8f"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#233378" opacity=".15"/>
  <!-- 后方浅蓝小圆片 -->
  <g transform="translate(65 42) rotate(13)">
    <ellipse cx="0" cy="4.2" rx="20" ry="11.2" fill="#82acd9" stroke="#537aa6" stroke-width="1.3"/>
    <ellipse cx="0" cy="0" rx="20" ry="11.2" fill="url(#bzd-pill)" stroke="#577fab" stroke-width="1.3"/>
    <path d="M-12-5.2a15 7.8 0 0 1 11-2.4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".92"/>
  </g>
  <!-- 前方粉蓝刻痕圆片 -->
  <g transform="translate(47 69) rotate(-18)">
    <ellipse cx="0" cy="5.2" rx="25.5" ry="14" fill="#7faad6" stroke="#4e749e" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="25.5" ry="14" fill="url(#bzd-pill)" stroke="#5379a3" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="20" ry="9.8" fill="none" stroke="#dcebfc" stroke-width="1"/>
    <path d="M0-10.5v21" stroke="#6c93bd" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M1.3-9.5v19" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity=".88"/>
    <path d="M-16-7.5a19 9.5 0 0 1 14-3" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" opacity=".92"/>
  </g>
  <!-- 右下角弯月繁星夜眠角标 -->
  <g transform="translate(88 82)">
    <circle cx="0" cy="3" r="21" fill="#1e2c6b" opacity=".16"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19.5" fill="url(#bzd-badge)" stroke="#23337a" stroke-width="1.5"/>
    <!-- 弯月 -->
    <g transform="translate(-1 0) rotate(-18)">
      <path d="M2.5-6.2a7.6 7.6 0 1 0 0 12.4 6.4 6.4 0 1 1 0-12.4Z" fill="#ffffff"/>
    </g>
    <!-- 两颗星芒 -->
    <path d="M5.5-7.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6L2-4l2.6-.9Z" fill="#ffe68a"/>
    <path d="M7.5 1.3l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6Z" fill="#ffe68a"/>
  </g>
