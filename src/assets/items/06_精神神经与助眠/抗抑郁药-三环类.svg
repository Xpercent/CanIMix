<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tca-pill" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f7f2ff"/>
      <stop offset=".55" stop-color="#dfd0fa"/>
      <stop offset="1" stop-color="#b89ee8"/>
    </linearGradient>
    <linearGradient id="tca-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7d6ae0"/>
      <stop offset="1" stop-color="#47369e"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#3a2b85" opacity=".14"/>
  <!-- 后方淡紫糖衣片 -->
  <g transform="translate(66 43) rotate(12)">
    <ellipse cx="0" cy="3.8" rx="18.5" ry="10.5" fill="#aa8ee0" stroke="#735ba6" stroke-width="1.3"/>
