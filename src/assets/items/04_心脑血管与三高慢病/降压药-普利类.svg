      <stop offset=".6" stop-color="#dcf2e5"/>
      <stop offset="1" stop-color="#b5dec7"/>
    </linearGradient>
    <linearGradient id="ace-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#5b84d6"/>
      <stop offset="1" stop-color="#2e52a3"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#234082" opacity=".14"/>
  <!-- 后方药片 -->
  <g transform="translate(66 43) rotate(13)">
    <rect x="-20" y="-6" width="40" height="20" rx="10" fill="#a2cfb6" stroke="#629478" stroke-width="1.3"/>
