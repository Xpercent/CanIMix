<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="lic-bark" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#9e623d"/>
      <stop offset=".55" stop-color="#7a4526"/>
      <stop offset="1" stop-color="#572e17"/>
    </linearGradient>
    <linearGradient id="lic-core" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fae189"/>
      <stop offset="1" stop-color="#d9a13b"/>
    </linearGradient>
    <linearGradient id="lic-leaf" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#b5cb7b"/>
      <stop offset="1" stop-color="#6e8c43"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="107" rx="43" ry="6" fill="#6b4120" opacity=".15"/>
  <!-- 右后甘草枝叶 -->
  <g transform="translate(82 54) rotate(12)" fill="none" stroke="#75522d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-8 18C2 6 9-6 14-24"/>
    <path d="M6-8c-2-9 2-13 10-16 0 8-4 13-10 16ZM2 1c6-7 11-7 18-5-4 6-11 9-18 5ZM-4-2c-7-4-9-9-7-16 6 3 9 9 7 16Z" fill="url(#lic-leaf)" stroke="#5b7336" stroke-width="1.1"/>
  </g>
  <!-- 甘草根段束 -->
  <g transform="translate(56 59) rotate(-26)">
    <!-- 后面根条 -->
    <rect x="-32" y="-14" width="60" height="12" rx="4" fill="url(#lic-bark)" stroke="#4f2914" stroke-width="1.2"/>
    <ellipse cx="27" cy="-8" rx="4" ry="5.8" fill="url(#lic-core)" stroke="#703f22" stroke-width="1.1"/>
    <!-- 中间主根条 -->
    <rect x="-35" y="-4" width="66" height="14" rx="5" fill="url(#lic-bark)" stroke="#4f2914" stroke-width="1.3"/>
    <path d="M-24 1h28M-16 6h22" stroke="#542c15" stroke-width="1" stroke-linecap="round" opacity=".55"/>
    <ellipse cx="30" cy="3" rx="4.5" ry="6.8" fill="url(#lic-core)" stroke="#703f22" stroke-width="1.1"/>
    <circle cx="30" cy="3" r="1.4" fill="#b57a26" opacity=".6"/>
    <!-- 下方根条 -->
    <rect x="-29" y="8" width="58" height="12" rx="4" fill="url(#lic-bark)" stroke="#4f2914" stroke-width="1.2"/>
    <ellipse cx="28" cy="14" rx="3.8" ry="5.8" fill="url(#lic-core)" stroke="#703f22" stroke-width="1.1"/>
    <!-- 麻绳捆扎 -->
    <path d="M-4-15v36M1-15v36" stroke="#e6c48a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-4-15v36M1-15v36" stroke="#9c723b" stroke-width=".9" stroke-linecap="round"/>
  </g>
  <!-- 前方切片甘草片 -->
  <g transform="translate(76 85) rotate(14)">
    <ellipse cx="0" cy="3" rx="14.5" ry="9" fill="#784425" stroke="#4f2914" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="14.5" ry="9" fill="url(#lic-core)" stroke="#7a4626" stroke-width="1.3"/>
    <ellipse cx="0" cy="0" rx="11" ry="6.2" fill="none" stroke="#c98e32" stroke-width=".9" stroke-dasharray="3 2"/>
  </g>
  <g transform="translate(52 91) rotate(-10)">
    <ellipse cx="0" cy="3" rx="13.5" ry="8.5" fill="#784425" stroke="#4f2914" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="13.5" ry="8.5" fill="url(#lic-core)" stroke="#7a4626" stroke-width="1.3"/>
    <ellipse cx="0" cy="0" rx="9.8" ry="5.5" fill="none" stroke="#c98e32" stroke-width=".9" stroke-dasharray="3 2"/>
  </g>
</svg>