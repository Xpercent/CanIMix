<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="dom-pill" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#dfe5f0"/>
    </linearGradient>
    <linearGradient id="dom-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f29b4b"/>
      <stop offset="1" stop-color="#c46516"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#995114" opacity=".14"/>
  <!-- 后方光滑小圆片 -->
  <g transform="translate(66 43) rotate(12)">
    <ellipse cx="0" cy="3.8" rx="18.5" ry="10.5" fill="#d3dae6" stroke="#8e9aad" stroke-width="1.3"/>
