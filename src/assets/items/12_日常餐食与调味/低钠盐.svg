<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="lna-glass" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#c3e0f2"/>
      <stop offset=".3" stop-color="#ebf6fc"/>
      <stop offset=".75" stop-color="#d5ebf7"/>
      <stop offset="1" stop-color="#a8cde3"/>
    </linearGradient>
    <linearGradient id="lna-cap" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#9fb0bf"/>
      <stop offset=".35" stop-color="#eef4f8"/>
      <stop offset=".7" stop-color="#cfdbe6"/>
      <stop offset="1" stop-color="#8c9eae"/>
    </linearGradient>
    <linearGradient id="lna-salt" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4edf5"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="108" rx="40" ry="5.5" fill="#467594" opacity=".14"/>
  <!-- 倾斜盐瓶主体 -->
  <g transform="translate(58 65) rotate(-12)">
    <!-- 金属瓶盖 -->
    <path d="M-16-28c0-9 7-14 16-14s16 5 16 14v5h-32Z" fill="url(#lna-cap)" stroke="#6c7e8f" stroke-width="1.3"/>
    <path d="M-18-24h36v5a2 2 0 0 1-2 2h-32a2 2 0 0 1-2-2Z" fill="url(#lna-cap)" stroke="#6c7e8f" stroke-width="1.3"/>
    <g fill="#536575">
      <circle cx="-6" cy="-35" r="1.2"/>
      <circle cx="0" cy="-36.5" r="1.2"/>
      <circle cx="6" cy="-35" r="1.2"/>
      <circle cx="-3" cy="-32" r="1.2"/>
      <circle cx="3" cy="-32" r="1.2"/>
    </g>
    <!-- 玻璃瓶身 -->
    <rect x="-24" y="-17" width="48" height="54" rx="11" fill="url(#lna-glass)" stroke="#6e99b5" stroke-width="1.4"/>
    <!-- 瓶内白色盐粒层 -->
    <path d="M-21 5c7-3 15 2 22 0 7-2 13-3 20 0v21a9 9 0 0 1-9 9h-24a9 9 0 0 1-9-9Z" fill="url(#lna-salt)" stroke="#bdd5e6" stroke-width=".8"/>
    <!-- 瓶身竖向玻璃高光 -->
    <path d="M-17-10v38" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>
    <!-- 低钠标签 Na ↓ -->
    <rect x="-18" y="-2" width="36" height="23" rx="5" fill="#ffffff" stroke="#5393bd" stroke-width="1.2"/>
    <rect x="-15.5" y=".5" width="31" height="18" rx="3.2" fill="#f0f8fd"/>
    <g transform="translate(0 9.5)">
      <!-- N -->
      <path d="M-12.5 4.5v-9l6 9v-9" fill="none" stroke="#2c709e" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- a -->
      <path d="M-3.2-1c1.3-1 4.2-.9 4.5.8v4.7m0-3.2c-2.2-.2-4.8.3-4.8 2 0 1.4 2.5 1.8 4.8.6" fill="none" stroke="#2c709e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- 向下箭头 ↓ -->
      <path d="M8.5-4.5v9M5.2 1.2L8.5 4.5l3.3-3.3" fill="none" stroke="#2aa376" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- 散落盐晶 -->
  <g fill="#f5f9fc" stroke="#8cb3cc" stroke-width="1" stroke-linejoin="round">
    <polygon points="88,97 92,94 95,98 91,101"/>
    <polygon points="97,102 100,100 102,103 99,105"/>
    <polygon points="81,103 84,101 86,104 83,106"/>
  </g>
</svg>