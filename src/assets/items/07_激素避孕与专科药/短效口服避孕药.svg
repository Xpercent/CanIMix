<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="coc-plate" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f7f9fc"/>
      <stop offset=".6" stop-color="#e3eaf2"/>
      <stop offset="1" stop-color="#c6d2e0"/>
    </linearGradient>
    <linearGradient id="coc-pill" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffe6ef"/>
      <stop offset="1" stop-color="#eb84a7"/>
    </linearGradient>
    <linearGradient id="coc-badge" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f07aa3"/>
      <stop offset="1" stop-color="#c24472"/>
    </linearGradient>
  </defs>
  <ellipse cx="62" cy="110" rx="44" ry="6" fill="#8c3052" opacity=".14"/>
  <!-- 倾斜周期避孕药转盘 -->
  <g transform="translate(52 62) rotate(-14) scale(1 .84)">
    <!-- 盘体厚度与正面 -->
    <circle cx="0" cy="4.5" r="32" fill="#b5c2d1" stroke="#7d8ea3" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="32" fill="url(#coc-plate)" stroke="#8293a8" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="10.5" fill="#fdf2f6" stroke="#c9b4be" stroke-width="1.1"/>
    <!-- 中心循环指示箭头 -->
    <path d="M-4.5-3.5A5.8 5.8 0 1 1-5 3" fill="none" stroke="#d9648d" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M-6.8-1.5l2.3-2.5 2.5 2" fill="none" stroke="#d9648d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 环绕每日小药片（8粉+2白周期示意） -->
    <g stroke="#9fb0c4" stroke-width=".9">
      <circle cx="20" cy="0" r="4.8" fill="#d1dce8"/><circle cx="20" cy="0" r="3.4" fill="url(#coc-pill)" stroke="#b8607e"/>
      <circle cx="16.2" cy="11.8" r="4.8" fill="#d1dce8"/><circle cx="16.2" cy="11.8" r="3.4" fill="url(#coc-pill)" stroke="#b8607e"/>
      <circle cx="6.2" cy="19" r="4.8" fill="#d1dce8"/><circle cx="6.2" cy="19" r="3.4" fill="url(#coc-pill)" stroke="#b8607e"/>
      <circle cx="-6.2" cy="19" r="4.8" fill="#d1dce8"/><circle cx="-6.2" cy="19" r="3.4" fill="url(#coc-pill)" stroke="#b8607e"/>
      <circle cx="-16.2" cy="11.8" r="4.8" fill="#d1dce8"/><circle cx="-16.2" cy="11.8" r="3.4" fill="url(#coc-pill)" stroke="#b8607e"/>
      <circle cx="-20" cy="0" r="4.8" fill="#d1dce8"/><circle cx="-20" cy="0" r="3.4" fill="url(#coc-pill)" stroke="#b8607e"/>
      <circle cx="-16.2" cy="-11.8" r="4.8" fill="#d1dce8"/><circle cx="-16.2" cy="-11.8" r="3.4" fill="url(#coc-pill)" stroke="#b8607e"/>
      <circle cx="-6.2" cy="-19" r="4.8" fill="#d1dce8"/><circle cx="-6.2" cy="-19" r="3.4" fill="url(#coc-pill)" stroke="#b8607e"/>
      <circle cx="6.2" cy="-19" r="4.8" fill="#d1dce8"/><circle cx="6.2" cy="-19" r="3.4" fill="#ffffff" stroke="#99a9bd"/>
      <circle cx="16.2" cy="-11.8" r="4.8" fill="#d1dce8"/><circle cx="16.2" cy="-11.8" r="3.4" fill="#ffffff" stroke="#99a9bd"/>
    </g>
    <path d="M-21-18a27 27 0 0 1 20-9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".88"/>
  </g>
  <!-- 右下角周期♀角标 -->
  <g transform="translate(88 82)">
    <circle cx="0" cy="3" r="21" fill="#8f294e" opacity=".15"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff"/>
    <circle cx="0" cy="0" r="19.5" fill="url(#coc-badge)" stroke="#a3335c" stroke-width="1.5"/>
    <path d="M-9.5-5.5a11 11 0 1 1 19 0" fill="none" stroke="#ffd4e3" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M7.5-7.5l2.2 2.4 2-2.6" fill="none" stroke="#ffd4e3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-2.2" r="4.8" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <path d="M0 2.6v7.4M-3.5 6.8h7" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>