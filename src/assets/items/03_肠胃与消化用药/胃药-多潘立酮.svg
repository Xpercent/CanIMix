    <ellipse cx="0" cy="4.8" rx="23.5" ry="13.2" fill="#d1d8e3" stroke="#8894a8" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="23.5" ry="13.2" fill="url(#dom-pill)" stroke="#8c98ab" stroke-width="1.5"/>
