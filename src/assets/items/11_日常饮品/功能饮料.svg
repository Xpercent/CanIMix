<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="eng-can" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffb84d"/>
      <stop offset=".35" stop-color="#f27424"/>
      <stop offset=".75" stop-color="#d94e16"/>
      <stop offset="1" stop-color="#a8360b"/>
    </linearGradient>
    <linearGradient id="eng-metal" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#b8c7d4"/>
      <stop offset=".32" stop-color="#f2f7fa"/>
      <stop offset=".7" stop-color="#d3dfe8"/>
